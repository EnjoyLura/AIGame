<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>末日护航 · DEADZONE CONVOY</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;background:#0a0808;overflow:hidden;font-family:'Noto Sans SC',sans-serif}
#stage{position:absolute;left:50%;top:50%;width:750px;height:1334px;transform-origin:center;background:#000;overflow:hidden;box-shadow:0 0 80px rgba(0,0,0,.9)}
canvas#game{position:absolute;left:0;top:0;width:750px;height:1334px}
/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;display:none}
.topbar{position:absolute;top:14px;left:14px;right:14px;height:104px;display:flex;gap:12px;align-items:stretch}
.tb{background:linear-gradient(180deg,rgba(18,16,14,.92),rgba(10,9,8,.88));border:1px solid #4a3d2c;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);padding:10px 14px;display:flex;flex-direction:column;justify-content:center}
.tb-left{width:170px}
.tb-mid{flex:1}
.tb-right{width:150px;align-items:flex-end}
.tb .cap{font-size:15px;color:#8f8062;letter-spacing:3px;font-weight:700}
.tb .val{font-family:'Chakra Petch';font-size:30px;color:#ffb648;font-weight:700;line-height:1.05}
.bar{height:14px;background:#1c1815;border:1px solid #4a3d2c;margin-top:5px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:1px;background:linear-gradient(90deg,#c9853a,#ffb648);transform-origin:left;transition:transform .15s}
#hpFill{background:linear-gradient(90deg,#b8562e,#ff9b48)}
#hpText{font-family:'Chakra Petch';font-size:15px;color:#e8d9b8;margin-top:3px;letter-spacing:1px}
.waveprog{height:6px;margin-top:4px}
.waveprog i{background:linear-gradient(90deg,#7a5a2e,#d8a44c)}
#muteBtn,#pauseBtn{pointer-events:auto;position:absolute;width:56px;height:44px;background:rgba(20,17,14,.9);border:1px solid #4a3d2c;color:#c9a86a;font-size:20px;font-family:'Chakra Petch';cursor:pointer;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
#muteBtn{top:126px;right:14px}#pauseBtn{top:126px;right:80px}
#bossBar{position:absolute;top:130px;left:110px;right:110px;display:none}
#bossBar .name{text-align:center;color:#ff7a5a;font-weight:900;font-size:20px;letter-spacing:4px;text-shadow:0 0 12px rgba(255,80,40,.6)}
#bossBar .bar{height:16px;border-color:#7a3a28}#bossBar .bar i{background:linear-gradient(90deg,#a12818,#ff6a3a)}
#comboTag{position:absolute;right:26px;top:400px;text-align:right;color:#ffd27a;font-family:'Chakra Petch';font-weight:700;font-size:34px;text-shadow:0 0 16px rgba(255,160,60,.7);opacity:0;transition:opacity .2s}
#comboTag small{display:block;font-size:16px;color:#c9a86a;letter-spacing:4px}
/* ---------- 底部技能栏 ---------- */
.bottombar{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;align-items:center;gap:13px;pointer-events:auto}
.heroSlot{width:97px;height:97px;position:relative;cursor:pointer;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
.heroSlot canvas{position:absolute;inset:0;width:100%;height:100%}
.heroSlot .cdmask{position:absolute;inset:0;pointer-events:none}
.heroSlot .skname{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:14px;color:#b9a37a;font-weight:700;letter-spacing:1px;white-space:nowrap}
.heroSlot.ready{animation:rdyPulse 1.1s infinite}
@keyframes rdyPulse{0%,100%{filter:drop-shadow(0 0 4px rgba(255,182,72,.5))}50%{filter:drop-shadow(0 0 18px rgba(255,182,72,.95))}}
#ultBtn{width:118px;height:118px;position:relative;cursor:pointer;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#171310;border:0;overflow:hidden}
#ultFill{position:absolute;left:0;right:0;bottom:0;height:0%;background:linear-gradient(180deg,#ff9b3a,#c94a1e);transition:height .2s}
#ultCore{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ffb648;z-index:2}
#ultCore .zh{font-size:26px;font-weight:900;letter-spacing:2px;text-shadow:0 0 10px rgba(255,150,50,.8)}
#ultCore .en{font-family:'Chakra Petch';font-size:12px;color:#e8b06a;letter-spacing:2px;margin-top:2px}
#ultBtn.full{animation:ultGlow .8s infinite}
@keyframes ultGlow{0%,100%{box-shadow:0 0 8px rgba(255,140,40,.4)}50%{box-shadow:0 0 34px rgba(255,170,60,1)}}
/* ---------- 覆盖层 ---------- */
.overlay{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(24,14,10,.82),rgba(5,4,3,.96));display:none;flex-direction:column;align-items:center;justify-content:center;z-index:10}
.gtitle{font-size:88px;font-weight:900;color:#f4e3c2;letter-spacing:10px;text-shadow:0 0 30px rgba(255,150,60,.35),0 4px 0 #6b3a1c}
.gsub{font-family:'Chakra Petch';color:#c96b3a;letter-spacing:8px;font-size:22px;margin-top:6px}
.gsub2{color:#8f8062;font-size:17px;margin-top:14px;letter-spacing:3px}
.btnMain{margin-top:44px;pointer-events:auto;cursor:pointer;background:linear-gradient(180deg,#e8973a,#b85c1e);color:#1c0f06;border:0;font-family:'Noto Sans SC';font-weight:900;font-size:30px;letter-spacing:8px;padding:20px 74px;clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);box-shadow:0 0 30px rgba(232,151,58,.4)}
.btnMain:active{transform:scale(.96)}
.herosRow{display:flex;gap:16px;margin-top:46px}
.hcard{width:158px;background:rgba(22,18,14,.9);border:1px solid #4a3d2c;padding:12px 8px 10px;text-align:center;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.hcard canvas{width:92px;height:92px;margin:0 auto;display:block}
.hcard .hn{color:#f0dcae;font-weight:900;font-size:20px;margin-top:6px}
.hcard .ht{color:#9b8a68;font-size:13px;margin-top:3px;letter-spacing:1px}
.hcard .hw{font-family:'Chakra Petch';font-size:12px;margin-top:5px;letter-spacing:1px}
.hcard.human .hw{color:#7ec8d8}.hcard.esp .hw{color:#ff9b6a}
/* 升级面板 */
#upgradeUI .ptitle{font-size:46px;font-weight:900;color:#ffb648;letter-spacing:8px;text-shadow:0 0 20px rgba(255,150,50,.4)}
#upgradeUI .psub{color:#8f8062;letter-spacing:4px;font-size:17px;margin-top:8px}
.cards{display:flex;gap:20px;margin-top:52px}
.ucard{width:212px;min-height:300px;background:linear-gradient(180deg,rgba(30,25,19,.96),rgba(16,13,10,.96));border:1px solid #5a4a32;padding:22px 16px;cursor:pointer;text-align:center;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);transition:transform .12s}
.ucard:active{transform:scale(.95)}
.ucard .rar{font-family:'Chakra Petch';font-size:13px;letter-spacing:3px;font-weight:700}
.ucard .un{font-size:26px;font-weight:900;color:#f4e3c2;margin-top:10px;line-height:1.3}
.ucard .ud{color:#b9a888;font-size:16px;margin-top:14px;line-height:1.7}
.ucard .icon{font-size:40px;margin-top:2px}
.ucard.rc{border-color:#4fae9e;box-shadow:0 0 18px rgba(60,180,160,.15)}.ucard.rc .rar{color:#5fd4c0}
.ucard.re{border-color:#c9853a;box-shadow:0 0 22px rgba(230,150,60,.25)}.ucard.re .rar{color:#ffb648}
.ucard.rcm{border-color:#6a5a40}.ucard.rcm .rar{color:#9b8a68}
/* 结算 */
#overUI .gtitle{font-size:64px;color:#ff7a5a;text-shadow:0 0 26px rgba(255,70,40,.4)}
.stats{margin-top:36px;display:flex;flex-direction:column;gap:14px}
.stat{display:flex;justify-content:space-between;width:420px;background:rgba(24,20,16,.85);border:1px solid #4a3d2c;padding:12px 22px;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.stat span{color:#8f8062;font-size:18px;letter-spacing:3px}
.stat b{font-family:'Chakra Petch';color:#ffb648;font-size:24px}
/* 暂停 */
#pauseUI .ptitle{font-size:50px;font-weight:900;color:#f4e3c2;letter-spacing:10px}
/* 波次横幅 */
#waveBanner{position:absolute;top:44%;left:0;right:0;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s;z-index:5}
#waveBanner .w1{font-size:74px;font-weight:900;color:#f4e3c2;letter-spacing:14px;text-shadow:0 0 26px rgba(255,160,60,.5)}
#waveBanner .w2{font-family:'Chakra Petch';color:#c96b3a;letter-spacing:6px;font-size:20px;margin-top:8px}
#toast{position:absolute;bottom:230px;left:0;right:0;text-align:center;color:#ffd27a;font-size:20px;font-weight:700;text-shadow:0 0 10px #000;opacity:0;transition:opacity .3s;pointer-events:none;z-index:6}
</style>
</head>
<body>
<div id="stage">
<canvas id="game"></canvas>

<div id="hud">
  <div class="topbar">
    <div class="tb tb-left"><span class="cap">波次 WAVE</span><span class="val" id="waveNum">01</span><div class="bar waveprog"><i id="waveProgFill"></i></div></div>
    <div class="tb tb-mid"><span class="cap">护航装甲 ARMOR</span><div class="bar"><i id="hpFill"></i></div><span id="hpText">1000 / 1000</span></div>
    <div class="tb tb-right"><span class="cap">击杀 KILLS</span><span class="val" id="killCount">0</span></div>
  </div>
  <button id="pauseBtn">Ⅱ</button><button id="muteBtn">♪</button>
  <div id="bossBar"><div class="name" id="bossName">异化巨兽</div><div class="bar"><i id="bossFill"></i></div></div>
  <div id="comboTag"><small>连杀 COMBO</small><span id="comboNum">x0</span></div>
  <div class="bottombar">
    <div class="heroSlot" id="slot0"><canvas width="97" height="97"></canvas><div class="cdmask"></div><div class="skname">弹幕风暴</div></div>
    <div class="heroSlot" id="slot1"><canvas width="97" height="97"></canvas><div class="cdmask"></div><div class="skname">过载光束</div></div>
    <div id="ultBtn"><div id="ultFill"></div><div id="ultCore"><span class="zh">湮灭</span><span class="en">ULTIMATE</span></div></div>
    <div class="heroSlot" id="slot2"><canvas width="97" height="97"></canvas><div class="cdmask"></div><div class="skname">天降陨石</div></div>
    <div class="heroSlot" id="slot3"><canvas width="97" height="97"></canvas><div class="cdmask"></div><div class="skname">极冰突刺</div></div>
  </div>
</div>

<div id="waveBanner"><div class="w1" id="wbT1">第 1 波</div><div class="w2" id="wbT2">HOSTILES INBOUND</div></div>
<div id="toast"></div>

<div class="overlay" id="menuUI" style="display:flex">
  <div class="gtitle">末日护航</div>
  <div class="gsub">DEADZONE CONVOY</div>
  <div class="gsub2">护送物资车队穿越虫鱼鸟兽异化的污染区 —— 车在，希望在。</div>
  <div class="herosRow" id="menuHeroes"></div>
  <button class="btnMain" id="startBtn">开 始 护 航</button>
</div>

<div class="overlay" id="upgradeUI">
  <div class="ptitle">补 给 升 级</div>
  <div class="psub">选择一项强化 · 车队继续前进</div>
  <div class="cards" id="upCards"></div>
</div>

<div class="overlay" id="overUI">
  <div class="gtitle">车队失守</div>
  <div class="gsub" style="letter-spacing:5px">CONVOY LOST</div>
  <div class="stats">
    <div class="stat"><span>坚守波次</span><b id="stWave">0</b></div>
    <div class="stat"><span>总击杀</span><b id="stKill">0</b></div>
    <div class="stat"><span>最高连杀</span><b id="stCombo">0</b></div>
  </div>
  <button class="btnMain" id="retryBtn">再 次 护 航</button>
</div>

<div class="overlay" id="pauseUI">
  <div class="ptitle">行动暂停</div>
  <button class="btnMain" id="resumeBtn">继 续</button>
  <button class="btnMain" id="restartBtn" style="margin-top:20px;font-size:22px;padding:14px 50px;background:linear-gradient(180deg,#5a5040,#3a332a);color:#e8d9b8">重 新 开 始</button>
</div>
</div>

<script>
/* ============================================================
   末日护航 DEADZONE CONVOY —— 竖屏护送割草原型
   ============================================================ */
'use strict';
const W=750,H=1334;
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
let DPR=1;
function fitStage(){
  const s=Math.min(innerWidth/W,innerHeight/H);
  document.getElementById('stage').style.transform=`translate(-50%,-50%) scale(${s})`;
  DPR=Math.min(devicePixelRatio||1,2);
  cv.width=W*DPR;cv.height=H*DPR;
}
addEventListener('resize',fitStage);fitStage();

/* ---------- 工具 ---------- */
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.arcTo(x+w,y,x+w,y+r,r);c.lineTo(x+w,y+h-r);c.arcTo(x+w,y+h,x+w-r,y+h,r);c.lineTo(x+r,y+h);c.arcTo(x,y+h,x,y+h-r,r);c.lineTo(x,y+r);c.arcTo(x,y,x+r,y,r);c.closePath();}
const fmt=n=>n>=1000?(n/1000).toFixed(1)+'k':Math.floor(n);

/* ---------- 音效（WebAudio 程序合成） ---------- */
let actx=null,muted=false;const sfxLast={};
function initAudio(){const A=window.AudioContext||window.webkitAudioContext;if(!actx&&A)actx=new A();if(actx&&actx.state==='suspended')actx.resume();}
function tone(f1,f2,dur,vol,type){if(!actx||muted)return;const o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';const t=actx.currentTime;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(f2,20),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+.02);}
let noiseBuf=null;
function noise(dur,vol,fq,type){if(!actx||muted)return;if(!noiseBuf){noiseBuf=actx.createBuffer(1,actx.sampleRate*0.7,actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
 const s=actx.createBufferSource();s.buffer=noiseBuf;const f=actx.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=fq;const g=actx.createGain();const t=actx.currentTime;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(actx.destination);s.start(t);s.stop(t+dur+.02);}
function sfx(n){if(!actx||muted)return;const now=performance.now();if(sfxLast[n]&&now-sfxLast[n]<45)return;sfxLast[n]=now;
 switch(n){
  case 'shoot':noise(.05,.06,2400,'highpass');break;
  case 'laser':tone(920,700,.05,.03,'square');break;
  case 'fire':noise(.25,.16,500);tone(150,60,.25,.12,'triangle');break;
  case 'ice':tone(1500,2400,.08,.07,'sine');break;
  case 'boom':noise(.5,.3,240);tone(100,38,.45,.22,'sine');break;
  case 'bigboom':noise(.9,.4,180);tone(80,28,.8,.3,'sine');tone(400,60,.6,.1,'sawtooth');break;
  case 'bite':tone(110,70,.09,.1,'sawtooth');break;
  case 'hit':noise(.03,.04,1400,'highpass');break;
  case 'ui':tone(660,880,.07,.09,'square');break;
  case 'heal':tone(520,990,.22,.1,'sine');break;
  case 'ready':tone(440,880,.15,.09,'square');break;
  case 'ult':tone(160,950,.8,.16,'sawtooth');break;
  case 'freeze':tone(2200,600,.25,.08,'sine');break;
 }}

/* ---------- 全局状态 ---------- */
let state='menu';           // menu | playing | upgrade | pause | over
let timeScale=1,shake=0,flash=0;
const world={scroll:0,decor:[],smoke:[]};
let monsters=[],bullets=[],particles=[],texts=[],pickups=[],timers=[],ultBeams=[];
let truck,wave,waveQueue,waveT,spawnDone,kills,combo,comboT,maxCombo,energy,energyMax;
let ultSeqT=0,ultActive=false,ultIdx=0,slowmoT=0,boss=null;
let waveDelay=0,gameOverT=0;

/* ---------- 英雄 ---------- */
const heroes=[
 {id:0,name:'凯恩',title:'游侠·步枪手',kind:'human',weapon:'rifle',x:198,y:942,
  cd:.27,dmg:21,range:1150,cdT:0,dmgMul:1,spdMul:1,cdMul:1,recoil:0,aim:-1.57,buffT:0,
  skill:{name:'弹幕风暴',cd:9,skCd:0}},
 {id:1,name:'艾达',title:'光棱·激光兵',kind:'human',weapon:'laser',x:552,y:942,
  cd:.1,dmg:6,range:730,cdT:0,dmgMul:1,spdMul:1,cdMul:1,recoil:0,aim:-1.57,overT:0,tick:0,target:null,retarget:0,
  skill:{name:'过载光束',cd:11,skCd:0}},
 {id:2,name:'炎狱',title:'燃烬·纵火者',kind:'esp',weapon:'fire',x:288,y:1092,
  cd:1.1,dmg:48,range:1150,cdT:0,dmgMul:1,spdMul:1,cdMul:1,recoil:0,aim:-1.57,
  skill:{name:'天降陨石',cd:13,skCd:0}},
 {id:3,name:'霜牙',title:'凛冬·御冰者',kind:'esp',weapon:'ice',x:462,y:1092,
  cd:.95,dmg:32,range:1150,cdT:0,dmgMul:1,spdMul:1,cdMul:1,recoil:0,aim:-1.57,
  skill:{name:'极冰突刺',cd:12,skCd:0}},
];
let globalUp={crit:.1,critD:1.8,energyMul:1,healMul:1,waveHeal:0};

/* ---------- 怪物定义 ---------- */
const MTYPES={
 bug:{hp:26,spd:118,dmg:7,r:20,energy:4,atkCd:.8,name:'异化虫'},
 fish:{hp:62,spd:88,dmg:13,r:24,energy:7,atkCd:1,name:'陆行怪鱼'},
 bird:{hp:42,spd:205,dmg:9,r:19,energy:6,atkCd:.9,name:'腐尸鸮'},
 beast:{hp:270,spd:46,dmg:26,r:34,energy:15,atkCd:1.2,name:'异化猛兽'},
 boss:{hp:3000,spd:32,dmg:42,r:62,energy:130,atkCd:1.6,name:'巨兽·灾骸'},
};

/* ---------- 预渲染背景 ---------- */
const skyC=document.createElement('canvas');skyC.width=W;skyC.height=H;
(function(){const c=skyC.getContext('2d');
 const g=c.createLinearGradient(0,0,0,H*.55);g.addColorStop(0,'#140b10');g.addColorStop(.5,'#2c1414');g.addColorStop(1,'#5c2a1a');
 c.fillStyle=g;c.fillRect(0,0,W,H*.55);
 // 血月
 const mx=560,my=190,mr=95;
 const mg=c.createRadialGradient(mx,my,mr*.3,mx,my,mr*2.6);mg.addColorStop(0,'rgba(220,110,70,.5)');mg.addColorStop(1,'rgba(220,110,70,0)');
 c.fillStyle=mg;c.fillRect(mx-mr*3,my-mr*3,mr*6,mr*6);
 c.fillStyle='#c96b4a';c.beginPath();c.arc(mx,my,mr,0,7);c.fill();
 c.fillStyle='rgba(120,50,35,.5)';c.beginPath();c.arc(mx-28,my-20,20,0,7);c.arc(mx+26,my+30,14,0,7);c.arc(mx+10,my-38,10,0,7);c.fill();
 // 云带
 c.fillStyle='rgba(30,14,12,.55)';
 for(let i=0;i<8;i++){const y=40+i*34;c.beginPath();c.ellipse(rand(0,W),y,rand(120,260),rand(10,20),0,0,7);c.fill();}
})();
// 城市剪影两条带（视差）
function makeSkyline(h,cA,cB,seed){const c=document.createElement('canvas');c.width=W;c.height=h;const g=c.getContext('2d');
 for(let x=0;x<W;){const w=rand(26,80),bh=rand(h*.25,h*.95);g.fillStyle=cA;g.fillRect(x,h-bh,w,bh);
  if(Math.random()<.5){g.fillStyle=cB;g.fillRect(x+4,h-bh+6,w-8,rand(8,20));}
  if(Math.random()<.4){g.fillStyle=cA;g.fillRect(x+w/2-2,h-bh-rand(10,40),4,50);}
  if(Math.random()<.5){g.fillStyle='rgba(255,140,70,.35)';g.fillRect(x+rand(4,w-10),h-bh+rand(8,bh-14),3,3);}

 let budget=8+n*3.1+Math.pow(n,1.18)*.8;
 const pool=[['bug',1]];if(n>=2)pool.push(['fish',1.7]);if(n>=3)pool.push(['bird',1.35]);if(n>=4)pool.push(['beast',4.2]);
 let t=0;
 if(n%5===0){waveQueue.push({t:2.5,type:'boss'});budget*=.55;}
 const iv=clamp(1.35-n*.02,.32,1.35);
 while(budget>0){const[ty,c]=pool[randi(0,pool.length-1)];budget-=c;t+=iv*rand(.6,1.4);
  if(ty==='bug'){const k=randi(2,4);for(let i=0;i<k;i++)waveQueue.push({t:t+i*.18,type:'bug'});}
  else waveQueue.push({t,type:ty});}
 waveQueue.sort((a,b)=>a.t-b.t);

/* ---------- 投射物更新 ---------- */
function updateBullets(dt){
 for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.life-=dt;
  if(b.type==='meteor'){b.x+=b.vx*dt;b.y+=b.vy*dt;
   P({x:b.x+rand(-6,6),y:b.y-14,type:'fire',color:Math.random()<.5?'#ffb054':'#ff5d2a',size:rand(5,11),life:.35,vy:rand(-40,0)});
   if(b.y>=b.ty){explode(b.tx,b.ty,b.boomR,b.boom);bullets.splice(i,1);}continue;}
  if(b.type==='fire'&&b.tg&&!b.tg.dead){ // 火球微追踪
   const a=Math.atan2(b.tg.y-b.y,b.tg.x-b.x),sp=Math.hypot(b.vx,b.vy);
   b.vx+=(Math.cos(a)*sp-b.vx)*dt*4;b.vy+=(Math.sin(a)*sp-b.vy)*dt*4;}
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.type==='fire')P({x:b.x+rand(-4,4),y:b.y,type:'fire',color:Math.random()<.5?'#ffb054':'#ff6a2a',size:rand(4,8),life:.25});
  if(b.type==='ice')P({x:b.x,y:b.y,type:'glow',color:'#9fe8ff',size:5,life:.12});
  if(b.life<=0||b.y<-100||b.x<-80||b.x>W+80){bullets.splice(i,1);continue;}
  let hit=false;
  for(const m of monsters){if(m.dead)continue;
   if(b.pierce&&b.hit&&b.hit.has(m))continue;
   if(dist(b.x,b.y,m.x,m.y)<m.r+b.r){
    if(b.type==='fire'){explode(b.x,b.y,72*heroes[2].dmgMul<9999?72*(1+((heroes[2].aoeMul||1)-1)):72,b.dmg);hit=true;break;}
    dealDamage(m,b.dmg);
    if(b.type==='ice'&&heroes[3].frostSlow)m.slowT=Math.max(m.slowT,1.2);
    burst(b.x,b.y,3,{color:b.type==='ice'?'#aee8ff':'#ffe0a0',type:'spark',s0:50,s1:180,life:.25,sz0:1,sz1:3});
    if(b.pierce){b.hit.add(m);}else{hit=true;break;}}
  }
  if(hit)bullets.splice(i,1);}
}

/* ---------- 怪物更新 ---------- */
function updateMonsters(dt){const TX=375,TY=935;
 for(const m of monsters){m.t+=dt;m.flash=Math.max(0,m.flash-dt);
  m.freezeT=Math.max(0,m.freezeT-dt);m.slowT=Math.max(0,m.slowT-dt);
  if(m.freezeT>0)continue;
  const slow=m.slowT>0?.45:1;
  const d=dist(m.x,m.y,TX,TY);
  if(d>168){
   let spd=m.spd*slow;
   if(m.type==='bug'){m.x+=Math.sin(m.t*6)*26*dt;m.y+=spd*dt;}
   else if(m.type==='fish'){m.hop=Math.abs(Math.sin(m.t*3));m.y+=spd*(0.55+m.hop)*dt;m.x+=Math.sin(m.t*2)*12*dt;}
   else if(m.type==='bird'){m.y+=spd*dt;m.x+=m.vx*dt+Math.sin(m.t*3.2)*90*dt;}
   else{m.y+=spd*dt;m.x+=(TX-m.x)*dt*.12;}
   m.x=clamp(m.x,40,W-40);
  }else{ // 攻击车辆
   m.atkT-=dt;
   if(m.atkT<=0){m.atkT=m.atkCd;damageTruck(m.dmg);
    burst(TX+rand(-70,70),TY+rand(-60,40),4,{color:'#ffb054',type:'spark',s0:40,s1:160,life:.3});
    sfx('bite');}}
 }}

   c.globalCompositeOperation='lighter';c.fillStyle='rgba(255,220,150,.7)';c.beginPath();c.arc(b.x,b.y,3,0,7);c.fill();c.globalCompositeOperation='source-over';}

   const g=c.createRadialGradient(b.x,b.y,2,b.x,b.y,b.r);g.addColorStop(0,'#fff0c0');g.addColorStop(.4,'#ff9b3a');g.addColorStop(1,'rgba(255,80,20,0)');
   c.fillStyle=g;c.beginPath();c.arc(b.x,b.y,b.r,0,7);c.fill();c.globalCompositeOperation='source-over';}
  else if(b.type==='ice'){c.save();c.translate(b.x,b.y);c.rotate(Math.atan2(b.vy,b.vx));
   c.globalCompositeOperation='lighter';c.fillStyle='rgba(160,230,255,.9)';
   c.beginPath();c.moveTo(16,0);c.lineTo(-6,-6);c.lineTo(-12,0);c.lineTo(-6,6);c.closePath();c.fill();
   c.fillStyle='rgba(255,255,255,.9)';c.beginPath();c.arc(4,0,3,0,7);c.fill();
   c.globalCompositeOperation='source-over';c.restore();}
  else if(b.type==='meteor'){c.globalCompositeOperation='lighter';
   const g=c.createRadialGradient(b.x,b.y,4,b.x,b.y,30);g.addColorStop(0,'#fff0c0');g.addColorStop(.4,'#ff8a2a');g.addColorStop(1,'rgba(255,60,10,0)');
   c.fillStyle=g;c.beginPath();c.arc(b.x,b.y,30,0,7);c.fill();c.globalCompositeOperation='source-over';
   // 落点预警
   c.strokeStyle='rgba(255,90,40,.7)';c.lineWidth=2;c.setLineDash([6,6]);
   c.beginPath();c.arc(b.tx,b.ty,80,0,7);c.stroke();c.setLineDash([]);}
 }}
function drawLaser(){const h=heroes[1];
 if(truck.dead||!h.target||h.target.dead)return;
 const tx=h.target.x,ty=h.target.y,sx=h.x+Math.cos(h.aim)*32,sy=h.y-14+Math.sin(h.aim)*32;
 const ov=h.overT>0,w=ov?14:6;
 ctx.save();ctx.globalCompositeOperation='lighter';
 ctx.strokeStyle=ov?'rgba(255,255,255,.35)':'rgba(110,240,255,.28)';ctx.lineWidth=w*2.6;
 ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(tx,ty);ctx.stroke();
 ctx.strokeStyle=ov?'#ffffff':'#8ef2ff';ctx.lineWidth=w;
 ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(tx,ty);ctx.stroke();
 ctx.strokeStyle='#ffffff';ctx.lineWidth=w*.35;
 ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(tx,ty);ctx.stroke();
 const g=ctx.createRadialGradient(tx,ty,2,tx,ty,26);
 g.addColorStop(0,ov?'rgba(255,255,255,.95)':'rgba(180,250,255,.9)');g.addColorStop(1,'rgba(110,240,255,0)');
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(tx,ty,26,0,7);ctx.fill();
 ctx.restore();}
function drawUltBeams(){ctx.save();ctx.globalCompositeOperation='lighter';
 for(const b of ultBeams){const p=b.t/b.life,w=90*(p<.15?p/.15:1);
  const g=ctx.createLinearGradient(b.x-w,0,b.x+w,0);
  g.addColorStop(0,'rgba(255,140,40,0)');g.addColorStop(.3,'rgba(255,180,80,.85)');g.addColorStop(.5,'rgba(255,255,240,1)');g.addColorStop(.7,'rgba(255,180,80,.85)');g.addColorStop(1,'rgba(255,140,40,0)');
  ctx.fillStyle=g;ctx.fillRect(b.x-w,0,w*2,H);
  ctx.fillStyle='rgba(255,120,40,.25)';ctx.fillRect(b.x-w*1.8,0,w*3.6,H);}
 ctx.restore();}
function drawParticles(){const c=ctx;
 for(const p of particles){const k=1-p.t/p.life;const a=clamp(k,0,1);
  if(p.type==='smoke'){c.globalAlpha=a*.5;c.fillStyle=p.color;c.beginPath();c.arc(p.x,p.y,p.size*(1+p.t*2),0,7);c.fill();}
  else if(p.type==='blood'){c.globalAlpha=a;c.fillStyle=p.color;c.beginPath();c.arc(p.x,p.y,p.size*k,0,7);c.fill();}
  else if(p.type==='shell'){c.globalAlpha=a;c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.color;c.fillRect(-3,-1.5,6,3);c.restore();}
  else if(p.type==='ring'){c.globalAlpha=a;c.strokeStyle=p.color;c.lineWidth=4*k;
   c.beginPath();c.arc(p.x,p.y,p.size+p.vx*(p.t/p.life),0,7);c.stroke();}
  else{c.globalCompositeOperation='lighter';c.globalAlpha=a;
   if(p.type==='spark'){c.strokeStyle=p.color;c.lineWidth=2;
    c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-p.vx*.02,p.y-p.vy*.02);c.stroke();}
   else if(p.type==='shard'){c.save();c.translate(p.x,p.y);c.rotate(p.rot+p.t*8);c.fillStyle=p.color;c.fillRect(-p.size,-p.size/3,p.size*2,p.size/1.5);c.restore();}
   else{c.fillStyle=p.color;c.beginPath();c.arc(p.x,p.y,p.size*(p.type==='fire'?(0.5+k*0.5):k+.3),0,7);c.fill();}
   c.globalCompositeOperation='source-over';}
  c.globalAlpha=1;}}
function drawPickups(){const c=ctx;
 for(const p of pickups){const bob=Math.sin(p.t*4)*5,bl=p.life-p.t<2&&Math.sin(p.t*14)>0;
  if(bl)continue;
  c.save();c.translate(p.x,p.y+bob);
  c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(0,14-bob,16,5,0,0,7);c.fill();
  c.fillStyle='#e8e4d8';rr(c,-15,-13,30,26,3);c.fill();
  c.fillStyle='#d84a3a';c.fillRect(-15,-3,30,6);c.fillRect(-4,-13,6,26);
  c.globalCompositeOperation='lighter';c.fillStyle='rgba(120,255,150,.25)';c.beginPath();c.arc(0,0,24,0,7);c.fill();
  c.restore();}}
function drawTexts(){const c=ctx;
 for(const t of texts){const k=t.t/t.life;c.globalAlpha=1-k;
  c.font=`bold ${t.size*(1+k*.15)}px 'Chakra Petch','Noto Sans SC'`;c.textAlign='center';
  c.strokeStyle='rgba(0,0,0,.8)';c.lineWidth=4;c.strokeText(t.txt,t.x,t.y-k*46);
  c.fillStyle=t.color;c.fillText(t.txt,t.x,t.y-k*46);c.globalAlpha=1;}}

function render(){
 ctx.setTransform(DPR,0,0,DPR,0,0);
 if(shake>0){ctx.translate(rand(-shake,shake),rand(-shake,shake));}
 // 天空 + 剪影视差
 ctx.drawImage(skyC,0,0);
 const o1=(world.scroll*.22)%240,o2=(world.scroll*.5)%180;
 ctx.drawImage(sky1,0,H*.55-240+o1);ctx.drawImage(sky1,0,H*.55+o1);
 ctx.drawImage(sky2,0,H*.55-180+o2);ctx.drawImage(sky2,0,H*.55+o2);
 // 地面/公路滚动
 const oR=world.scroll%H;
 ctx.drawImage(roadC,0,oR-H);ctx.drawImage(roadC,0,oR);
 ctx.fillStyle='#2c1414';ctx.fillRect(0,H*.55,W,8); // 地平线过渡
 for(const d of world.decor)drawDecor(d);
 drawPickups();
 drawTruck();
 for(const h of heroes)drawHero(h);
 const sorted=[...monsters].sort((a,b)=>a.y-b.y);
 for(const m of sorted)drawMonster(m);
 drawBullets();
 drawLaser();
 drawUltBeams();
 drawParticles();
 drawTexts();
 // 大招全屏光
 ctx.drawImage(vigC,0,0);
 if(flash>0){ctx.fillStyle=`rgba(255,240,220,${flash*.8})`;ctx.fillRect(0,0,W,H);}
 if(ultActive){ctx.fillStyle='rgba(255,100,30,.06)';ctx.fillRect(0,0,W,H);}}

/* ============================================================
   更 新 循 环
   ============================================================ */
function updateAmbient(dt){
 world.scroll+=170*dt;
 if(Math.random()<dt*1.1)spawnDecor();
 for(let i=world.decor.length-1;i>=0;i--){world.decor[i].y+=170*dt;if(world.decor[i].y>H+160)world.decor.splice(i,1);}
 // 车尾烟
 if(!truck.dead&&Math.random()<dt*14)
  P({x:truck.x+rand(-40,40),y:truck.y+140,vx:rand(-15,15),vy:rand(60,120),type:'smoke',color:'#4a453e',size:rand(6,12),life:1});
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.t+=dt;
  if(p.t>=p.life){particles.splice(i,1);continue;}
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*dt;p.rot+=(p.vr||0)*dt;
  if(p.type==='fire')p.vy-=200*dt;}
 for(let i=texts.length-1;i>=0;i--){texts[i].t+=dt;if(texts[i].t>=texts[i].life)texts.splice(i,1);}
 shake=Math.max(0,shake-dt*26);flash=Math.max(0,flash-dt*1.6);
 for(let i=ultBeams.length-1;i>=0;i--){ultBeams[i].t+=dt;if(ultBeams[i].t>=ultBeams[i].life)ultBeams.splice(i,1);}}
function updateCombat(dt){
 updateWave(dt);
 for(const h of heroes)heroUpdate(h,dt);
 for(let i=timers.length-1;i>=0;i--){timers[i].t-=dt;if(timers[i].t<=0){const f=timers[i].fn;timers.splice(i,1);f();}}
 updateBullets(dt);updateMonsters(dt);updatePickups(dt);updateUlt(dt);
 comboT-=dt;if(comboT<=0)combo=0;}

let last=0;
function loop(ts){const now=ts/1000;let dt=Math.min(now-last,.05);last=now;
 if(state!=='pause'){
  const sdt=dt*timeScale;
  updateAmbient(sdt);
  if(state==='playing')updateCombat(sdt);
  else if(state==='over'){gameOverT+=dt;}
 }
 render();updateHUD();requestAnimationFrame(loop);}

/* ---------- HUD 刷新 ---------- */
const slotEls=[0,1,2,3].map(i=>document.getElementById('slot'+i));
const hpFill=document.getElementById('hpFill'),hpText=document.getElementById('hpText'),
 killEl=document.getElementById('killCount'),waveProg=document.getElementById('waveProgFill'),
 ultFill=document.getElementById('ultFill'),ultBtn=document.getElementById('ultBtn'),
 comboTag=document.getElementById('comboTag'),comboNum=document.getElementById('comboNum'),
 bossFill=document.getElementById('bossFill');
function updateHUD(){if(!truck)return;
 hpFill.style.transform=`scaleX(${clamp(truck.hp/truck.maxHp,0,1)})`;
 hpText.textContent=fmt(Math.max(0,truck.hp))+' / '+fmt(truck.maxHp);
 killEl.textContent=kills;
 const total=waveQueue?waveQueue.length+monsters.length+kills:1;
 waveProg.style.transform=`scaleX(${total?kills/total:0})`;
 for(let i=0;i<4;i++){const h=heroes[i],el=slotEls[i],p=h.skill.skCd/(h.skill.cd*h.cdMul);
  el.querySelector('.cdmask').style.background=p>0.002?`conic-gradient(transparent 0 ${(1-p)*360}deg, rgba(0,0,0,.78) ${(1-p)*360}deg 360deg)`:'none';
  el.classList.toggle('ready',p<=0.002&&state==='playing');}
 ultFill.style.height=(energy/energyMax*100)+'%';
 ultBtn.classList.toggle('full',energy>=energyMax&&state==='playing');
 if(boss){bossFill.style.transform=`scaleX(${clamp(boss.hp/boss.maxHp,0,1)})`;}
 if(combo>=3){comboTag.style.opacity=1;comboNum.textContent='x'+combo;}else comboTag.style.opacity=0;}

/* ---------- 英雄徽章绘制 ---------- */
function drawEmblem(c,weapon,size,kind){
 const s=size;c.clearRect(0,0,s,s);
 // 底
 const g=c.createLinearGradient(0,0,0,s);
 g.addColorStop(0,kind==='human'?'#26333a':'#38201a');g.addColorStop(1,'#12100d');
 c.fillStyle=g;rr(c,3,3,s-6,s-6,10);c.fill();
 c.strokeStyle=kind==='human'?'#4d8899':'#a35a2e';c.lineWidth=2;rr(c,3,3,s-6,s-6,10);c.stroke();
 c.save();c.translate(s/2,s/2-4);const k=s/97;
 c.scale(k,k);c.lineCap='round';
 if(weapon==='rifle'){c.strokeStyle='#d8c9a8';c.lineWidth=5;
  c.beginPath();c.moveTo(-22,8);c.lineTo(20,-2);c.stroke();c.lineWidth=8;c.beginPath();c.moveTo(2,3);c.lineTo(10,8);c.stroke();
  c.strokeStyle='#ffb648';c.lineWidth=3;c.beginPath();c.moveTo(-22,8);c.lineTo(-32,12);c.stroke();
  c.fillStyle='#ffb648';c.beginPath();c.arc(-33,12,3,0,7);c.fill();}
 else if(weapon==='laser'){c.strokeStyle='#5a6a70';c.lineWidth=7;c.beginPath();c.moveTo(-14,14);c.lineTo(8,-2);c.stroke();
  c.strokeStyle='#6ef0ff';c.lineWidth=3;c.beginPath();c.moveTo(10,-4);c.lineTo(30,-16);c.moveTo(10,0);c.lineTo(32,-4);c.moveTo(8,4);c.lineTo(28,8);c.stroke();
  c.fillStyle='#fff';c.beginPath();c.arc(9,-3,4,0,7);c.fill();}
 else if(weapon==='fire'){c.fillStyle='#ff8a2a';c.beginPath();
  c.moveTo(0,-26);c.bezierCurveTo(16,-10,20,2,12,16);c.bezierCurveTo(8,22,-8,22,-12,16);c.bezierCurveTo(-20,2,-16,-10,0,-26);c.fill();
  c.fillStyle='#ffd27a';c.beginPath();c.moveTo(0,-8);c.bezierCurveTo(8,2,8,10,0,16);c.bezierCurveTo(-8,10,-8,2,0,-8);c.fill();
  c.fillStyle='#fff0c0';c.beginPath();c.arc(0,10,4,0,7);c.fill();}
 else{c.strokeStyle='#9fe8ff';c.lineWidth=3;
  for(let i=0;i<6;i++){const a=i*Math.PI/3;c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(a)*24,Math.sin(a)*24);c.stroke();
   c.beginPath();c.moveTo(Math.cos(a)*16-Math.cos(a+2.1)*7,Math.sin(a)*16-Math.sin(a+2.1)*7);c.lineTo(Math.cos(a)*16,Math.sin(a)*16);c.lineTo(Math.cos(a)*16+Math.cos(a+2.1)*7,Math.sin(a)*16+Math.sin(a+2.1)*7);c.stroke();}
  c.fillStyle='#fff';c.beginPath();c.arc(0,0,5,0,7);c.fill();}
 c.restore();
 c.fillStyle=kind==='human'?'#7ec8d8':'#ff9b6a';c.font=`bold ${10*k+6}px 'Chakra Petch'`;c.textAlign='center';
 c.fillText(kind==='human'?'HUMAN':'ESP',s/2,s-8);}
// 英雄槽徽章
slotEls.forEach((el,i)=>drawEmblem(el.querySelector('canvas').getContext('2d'),heroes[i].weapon,97,heroes[i].kind));
// 菜单英雄卡
(function(){const box=document.getElementById('menuHeroes');
 for(const h of heroes){const d=document.createElement('div');d.className='hcard '+h.kind;
  d.innerHTML=`<canvas width="92" height="92"></canvas><div class="hn">${h.name}</div><div class="ht">${h.title}</div><div class="hw">${h.kind==='human'?'TACTICAL':'PSIONIC'}</div>`;
  drawEmblem(d.querySelector('canvas').getContext('2d'),h.weapon,92,h.kind);box.appendChild(d);}})();

/* ---------- 输入 ---------- */
slotEls.forEach((el,i)=>el.addEventListener('pointerdown',e=>{e.stopPropagation();initAudio();heroSkill(heroes[i]);}));
ultBtn.addEventListener('pointerdown',e=>{e.stopPropagation();initAudio();tryUlt();});
document.getElementById('startBtn').addEventListener('pointerdown',()=>{initAudio();sfx('ui');startGame();});
document.getElementById('retryBtn').addEventListener('pointerdown',()=>{initAudio();sfx('ui');startGame();});
document.getElementById('resumeBtn').addEventListener('pointerdown',()=>{sfx('ui');state='playing';document.getElementById('pauseUI').style.display='none';});
document.getElementById('restartBtn').addEventListener('pointerdown',()=>{sfx('ui');document.getElementById('pauseUI').style.display='none';startGame();});
document.getElementById('pauseBtn').addEventListener('pointerdown',()=>{initAudio();sfx('ui');if(state==='playing'){state='pause';document.getElementById('pauseUI').style.display='flex';}});
document.getElementById('muteBtn').addEventListener('pointerdown',()=>{initAudio();muted=!muted;document.getElementById('muteBtn').textContent=muted?'✕':'♪';});
// 拾取医疗包
cv.addEventListener('pointerdown',e=>{if(state!=='playing')return;
 const r=cv.getBoundingClientRect();
 const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
 for(let i=pickups.length-1;i>=0;i--){const p=pickups[i];
  if(dist(x,y,p.x,p.y)<60){pickups.splice(i,1);
   truck.hp=clamp(truck.hp+90*globalUp.healMul,0,truck.maxHp);
   dmgText(p.x,p.y-20,'+'+fmt(90*globalUp.healMul),'#7de08a',28);sfx('heal');
   burst(p.x,p.y,12,{color:'#7de08a',type:'spark',s0:40,s1:200,life:.5});break;}}});

/* ---------- 开始 / 重置 ---------- */
function resetGame(){
 truck={x:375,y:935,hp:1000,maxHp:1000,dead:false};
 monsters=[];bullets=[];particles=[];texts=[];pickups=[];timers=[];ultBeams=[];
 kills=0;combo=0;comboT=0;maxCombo=0;energy=0;energyMax=800;
 ultActive=false;timeScale=1;boss=null;wave=0;
 document.getElementById('bossBar').style.display='none';
 for(const h of heroes){h.cdT=0;h.skill.skCd=0;h.dmgMul=1;h.spdMul=1;h.cdMul=1;h.buffT=0;h.overT=0;h.target=null;delete h.aoeMul;delete h.frostSlow;}
 globalUp={crit:.1,critD:1.8,energyMul:1,healMul:1,waveHeal:0};
 world.decor=[];for(let i=0;i<8;i++)spawnDecor(rand(0,H));}
function startGame(){resetGame();
 document.getElementById('menuUI').style.display='none';
 document.getElementById('overUI').style.display='none';
 document.getElementById('hud').style.display='block';
 state='playing';beginWave(1);}
resetGame();
requestAnimationFrame(loop);
</script>
