<script>

const notes = {
  battle:['03 / 护送','场景居中，操作围合','章节、路线、阵容和开始护送在同一屏内闭合。',['场景是主背景，不放入网页式展示卡。两侧最多各 3 个图标入口。','奖励、四人编队、出战按钮共用底部固定操作带，不随内容滚走。','短屏优先压缩场景高度，不缩放整页、不隐藏出战。']],
  hero:['02 / 英雄','人、装备、背包同屏','上半屏固定角色与六槽，下半屏只滚动物品格。',['背包采用 6 列物品网格，分类栏固定在底导上方；物品格为正方形，360–430px 评审屏宽下约 53–64px。','图标占格宽 70%，品质、等级、可升级角标贴四角，不参与格高计算；标准屏约 4 行，短屏保留约 2 行并独立滚动。','拖动时匹配槽高亮；落错槽位不改变数据；穿戴后旧装备回到原背包格。','支持 4 名英雄各自穿戴。点选物品后，底部单行显示名称和战力差。','立绘两侧各一列图标：左侧 技能 / 天赋 / 升星，右侧 武器 / 核心 紧邻装备栏；招募与工坊留在方案行，天赋不重复出现在基地。']],
  shop:['01 / 商店','货架滚动，分类不动','招募以大幅资源区承载，消耗按钮贴着对应货架。',['保留竞品的上下两组招募货架，下接紧凑的资源网格。','不放大段说明、商品卡介绍或页面大标题。','只滚动货架，资源栏、分类栏、五席导航始终固定。']],
  action:['04 / 行动','玩法据点，不做任务列表','挑战装置形成视觉中心，日常与资源围绕其布置。',['签到、任务、成就、补给收成一排轻入口。','试炼与无尽是中部两个主体，四种副本按资源图标直达。','远征状态占底部横带；所有玩法入口保持一屏可见。']],
  base:['05 / 基地','建筑本身就是入口','用建筑体块与标签形成基地地图，而不是管理表格。',['八个设施固定排入纵向场景，点击建筑等同点击入口。','已解锁显示等级，未解锁显示门槛，不另做管理按钮。','基地只承担建筑、等级与营地增益；英雄天赋归英雄页，此处不重复放入口。']]
};
let page = 'battle', hero = 0, chapter = 3, difficulty = '普通', bagTab = '装备', shopTab = '补给', filter = '全部';
let selected = null, freeClaimed = false, feedbackTimer, drag = null, pointerSession = null, suppressClickUntil = 0;
let inventory, equipped;
const scrollMemory = {};
function makeItem(id,slot,tier,level){return {id,slot,tier,level,name:['制式','战术','精锐'][tier-1]+slots[slot],power:tier*60+level*8};}
function resetGear(){inventory=Array.from({length:42},(_,i)=>makeItem('bag-'+i,i%6,3-Math.floor(i/6)%3,1+i%5));equipped=names.map((_,h)=>slots.map((_,s)=>makeItem(`eq-${h}-${s}`,s,1,2)));selected=null;}
resetGear();
function power(){return 2100+equipped[hero].reduce((n,e)=>n+e.power,0);}
function preview(label,icon,extra='',cls=''){return `<button class="hot ${cls}" data-preview="${label}" title="${label}">${art(icon)}<span>${label}</span>${extra}</button>`;}
function flatTabs(values,current,key){return `<div class="flat-tabs">${values.map(v=>`<button data-${key}="${v}" class="${v===current?'active':''}" aria-pressed="${v===current}">${v}</button>`).join('')}</div>`;}
function rememberScroll(){const bag=$('.bag-scroll'),shop=$('.shop-scroll');if(bag)scrollMemory['bag-'+bagTab+'-'+filter]=bag.scrollTop;if(shop)scrollMemory['shop-'+shopTab]=shop.scrollTop;}
function render(){
  $('#hud').innerHTML=`<button class="portrait" data-preview="个人资料" aria-label="个人资料">${art('person')}<strong>15</strong></button><div class="resources">${[['gem','1,680','钻石'],['coin',freeClaimed?'13,100':'12,800','金币'],['energy','25/30','体力']].map(r=>`<button class="currency" data-preview="${r[2]}来源" aria-label="${r[2]} ${r[1]}">${art(r[0])}<b>${r[1]}</b><span class="plus">+</span></button>`).join('')}</div><div class="identity"><div><span class="identity-name">护送队长</span><div class="xp"><span></span></div></div><div class="hud-tools"><button class="tiny-icon" data-preview="邮件" aria-label="邮件">${art('mail')}<i class="dot"></i></button><button class="tiny-icon" data-preview="设置" aria-label="设置">${art('tool')}</button></div></div>`;
  $('#nav').innerHTML=tabs.map(t=>`<button data-nav="${t[0]}" aria-current="${page===t[0]?'page':'false'}">${art(t[2])}<span>${t[1]}</span>${t[0]==='action'?'<i class="dot"></i>':''}</button>`).join('');
  $('#review-nav').innerHTML=tabs.map((t,i)=>`<button data-nav="${t[0]}" aria-current="${page===t[0]?'page':'false'}"><span class="number">0${i+1}</span>${t[1]}</button>`).join('');
  $('#main').innerHTML=({battle:battlePage,hero:heroPage,shop:shopPage,action:actionPage,base:basePage}[page])();
  const n=notes[page];$('#note-index').textContent=n[0];$('#note-title').textContent=n[1];$('#note-desc').textContent=n[2];$('#note-list').innerHTML=n[3].map(v=>`<li>${v}</li>`).join('');
  if($('.bag-scroll'))$('.bag-scroll').scrollTop=scrollMemory['bag-'+bagTab+'-'+filter]||0;
  if($('.shop-scroll'))$('.shop-scroll').scrollTop=scrollMemory['shop-'+shopTab]||0;
  updateSelection();
}
function battlePage(){
  const cn=['城郊公路','废弃车站','跨江大桥','工业园区','最后防线'];
  return `<section class="screen battle-screen" aria-label="护送主页面"><div class="chapter-head"><button class="arrow" data-chapter="-1" aria-label="上一章" ${chapter===1?'disabled':''}>‹</button><div><h1>${chapter}. ${cn[chapter-1]}</h1><small>${chapter>3?'尚未解锁':'护送主线'} · ${chapter}/5</small></div><button class="arrow" data-chapter="1" aria-label="下一章" ${chapter===5?'disabled':''}>›</button></div><div class="difficulty">${['普通','精英','噩梦'].map(d=>`<button data-difficulty="${d}" class="${difficulty===d?'active':''}" aria-pressed="${difficulty===d}">${d==='噩梦'?'♙ ':''}${d}</button>`).join('')}</div><div class="stage"><div class="stage-scene">${art('road')}</div><div class="side-tools left">${preview('七日签到','medal','<i class="dot"></i>')}${preview('每日任务','scroll','<i class="dot"></i>')}${preview('活动','flag')}</div><div class="side-tools right">${preview('图鉴','scroll')}${preview('排行','medal')}${preview('补给','box')}</div><div class="stage-caption"><span>战力 <b>${power().toLocaleString()}</b></span><span>推荐 ${difficulty==='普通'?'2,200':'3,200'}</span></div></div><div class="milestones">${['首次通关','耐久过半','完美护送'].map((t,i)=>preview(t,'box',`<small>${chapter<3&&difficulty==='普通'?'已达成':i===0?'未通关':'未达成'}</small>`)).join('')}</div><div class="team-strip"><span class="team-label"><b>编队 1</b>3 / 4 已上阵</span>${names.map((n,i)=>`<button class="slot-avatar" data-preview="调整编队 ${n}" aria-label="编队 ${n}">${i<3?art('person'):'<span style="display:block;height:30px;font-size:25px">+</span>'}<small>${i<3?n:'空席'}</small></button>`).join('')}${preview('编队','tool')}</div><div class="battle-bottom">${preview('巡逻','truck','<i class="dot"></i>')}<button class="game-button major start" data-preview="${chapter>3?'通关上一章解锁':difficulty==='噩梦'?'指挥中心 Lv.3 解锁':'开始护送'}">${chapter>3?'尚未解锁':difficulty==='噩梦'?'噩梦未解锁':'开始护送'}<small>${art('energy')}5</small></button>${preview('掉落','box')}</div></section>`;
}
function heroPage(){
  return `<section class="screen hero-screen" aria-label="英雄主页面"><div class="hero-roster">${names.map((n,i)=>`<button data-hero="${i}" class="${hero===i?'active':''}" aria-pressed="${hero===i}">${art('person')}<span>${n}</span></button>`).join('')}</div><div class="hero-stage"><div class="hero-quick left">${preview('技能','portal')}${preview('天赋','gem')}${preview('升星','medal')}</div><div class="hero-figure"><h2 class="hero-name">${names[hero]}<small>★★</small></h2>${art('figure')}<div class="power">战力<strong id="hero-power">${power().toLocaleString()}</strong></div></div><div class="hero-quick right">${preview('武器','gun')}${preview('核心','box')}</div><div class="equipment" aria-label="英雄装备栏">${equipped[hero].map((e,s)=>`<button class="equip-slot" data-slot="${s}" aria-label="${slots[s]}槽 ${e.name} 等级${e.level}" title="${slots[s]}槽 · ${e.name}"><span class="slot-name">${slots[s]}</span>${art(slotIcons[s])}<span class="tier">${'◆'.repeat(e.tier)}</span><span class="eq-level">Lv.${e.level}</span></button>`).join('')}</div></div><div class="hero-tools"><div class="loadouts"><b>方案</b><button class="active" data-preview="方案 1">1</button><button data-preview="方案 2">2</button><button data-preview="方案 3">3</button></div>${preview('招募','person')}${preview('工坊','tool')}</div><div class="bag-section"><div class="bag-head"><b>我的背包 <small>${inventory.length}/120</small></b><div class="bag-head-right"><select id="bag-filter" aria-label="背包筛选"><option ${filter==='全部'?'selected':''}>全部</option>${slots.map(s=>`<option ${filter===s?'selected':''}>${s}</option>`).join('')}</select>${preview('合成','tool')}</div></div><div class="bag-scroll" tabindex="0" role="region" aria-label="背包物品滚动区"><div class="bag-grid">${bagItems()}</div></div><div class="bag-detail" aria-live="polite"><b id="item-info">${bagTab} · ${bagTab==='装备'?'未选择物品':'物品已按分类展示'}</b><button id="clear-item" class="hidden" data-clear aria-label="取消物品选择">取消</button></div>${flatTabs(['装备','宝石','材料','道具'],bagTab,'bag-tab')}</div></section>`;
}
function bagItems(){
  if(bagTab==='装备')return inventory.filter(e=>filter==='全部'||slots[e.slot]===filter).map(e=>`<button class="item q${e.tier}" data-item="${e.id}" aria-label="${e.name} 等级${e.level} 编号${e.id}" title="${e.name} · Lv.${e.level}" draggable="false">${art(slotIcons[e.slot])}<span class="quality">${'◆'.repeat(e.tier)}</span><span class="item-number">${e.level}</span>${e.power>equipped[hero][e.slot].power?'<span class="upgrade">↑</span>':''}</button>`).join('');
  const lists={宝石:['攻击宝石','射速宝石','暴击宝石','射程宝石'],材料:['合金','强化石','改装图纸','英雄核心'],道具:['体力药水','金币箱','招募券']};
  return Array.from({length:bagTab==='宝石'?30:bagTab==='材料'?18:9},(_,i)=>`<button class="item q${i%3+1}" data-preview="${lists[bagTab][i%lists[bagTab].length]}" aria-label="${lists[bagTab][i%lists[bagTab].length]} 数量${i+1}">${art(bagTab==='宝石'?'gem':bagTab==='材料'?'scroll':'box')}<span class="item-number">${i+1}</span></button>`).join('');
}
function offer(title,iconName,count,verb='招募'){return `<article class="shop-offer"><div class="offer-art">${art(iconName)}</div><div class="offer-copy"><h2>${title}</h2><p>剩余 <strong>${count}</strong> 次必得</p><small>${title==='英雄招募'?'英雄 / 英雄碎片':'稀有装备 / 强化材料'}</small></div><div class="offer-buttons">${preview('免费','box','<small>1 / 1</small>')}<button class="game-button" data-preview="${title}单次">${verb} 1 次<small>钻石 ×200</small></button><button class="game-button" data-preview="${title}十次">${verb} 10 次<small>钻石 ×1,800</small></button></div></article>`;}
function shopPage(){
  const goods=shopTab==='装备'?slots.map((s,i)=>[s,slotIcons[i],'金币 ×1,000']):shopTab==='材料'?[['合金 ×20','box','金币 ×300'],['强化石 ×10','gem','金币 ×200'],['改装图纸 ×5','scroll','钻石 ×100'],['英雄核心 ×5','gem','钻石 ×200']]:shopTab==='礼包'?[['每日补给','box','免费'],['成长礼包','box','钻石 ×300'],['护送礼包','truck','钻石 ×100'],['招募礼包','person','钻石 ×500']]:[['金币 ×1,000','coin','钻石 ×100'],['体力 ×10','energy','钻石 ×50'],['强化石 ×10','gem','金币 ×200']];
  return `<section class="screen shop-screen" aria-label="商店主页面"><div class="shop-mast"><div><h1>${shopTab==='补给'?'军需补给':shopTab}</h1><p>护送队物资储备</p></div>${art('gun')}<button class="hot" data-free title="每日免费补给">${art('box')}<span>${freeClaimed?'已领取':'每日免费'}</span>${freeClaimed?'':'<i class="dot"></i>'}</button></div><div class="shop-scroll" role="region" aria-label="商店货架滚动区" tabindex="0">${shopTab==='补给'?offer('英雄招募','person',7)+offer('装备补给','box',10,'抽取'):''}<div class="section-label"><b>${shopTab==='补给'?'常用资源':shopTab+'货架'}</b><small>每日 00:00 刷新</small></div><div class="goods">${(shopTab==='补给'?goods:[...goods,...goods,...goods]).map((g,i)=>`<article class="good">${art(g[1])}<b>${g[0]}</b><small>剩余 ${i%3+1} / ${i%3+1}</small><button class="game-button" data-preview="购买${g[0]}">${g[2]}</button></article>`).join('')}</div></div>${flatTabs(['补给','装备','材料','礼包'],shopTab,'shop-tab')}</section>`;
}
function actionPage(){return `<section class="screen action-screen" aria-label="行动主页面"><div class="action-title"><h1>作战行动</h1><small>今日活跃 40 / 100</small></div><div class="action-daily">${preview('签到','medal','<small>第 3 天</small><i class="dot"></i>')}${preview('任务','scroll','<small>1 项可领</small><i class="dot"></i>')}${preview('成就','medal','<small>完成 8 项</small>')}${preview('补给','box','<small>免费 1 次</small>')}</div><div class="challenge-ground"><button class="entry" data-preview="无尽试炼">${art('tower')}<h2>无尽试炼</h2><small>第 12 层 · 不耗体力</small></button><button class="entry locked" data-preview="无尽护送：通关第5章解锁">${art('portal')}<h2>无尽护送</h2><small>通关第 5 章解锁</small></button></div><div class="dungeons"><div class="section-label"><b>资源副本</b><small>每次 8 体力</small></div><div class="dungeon-row">${[['金币','coin'],['强化石','gem'],['合金','box'],['图纸','scroll']].map(d=>preview(d[0],d[1],'<small>3 / 3 次</small>')).join('')}</div></div><div class="expedition">${art('truck')}<div class="expedition-text"><b>远征 · 物资搜寻</b><small>工程师执行中　02:36</small></div>${preview('远征','flag')}</div><div class="action-footer">${preview('怪物图鉴','scroll')}${preview('排行榜','medal')}${preview('行动记录','flag')}</div></section>`;}
function basePage(){const buildings=[['指挥中心','base','Lv.2'],['研究所','lab','Lv.1'],['训练营','base','Lv.2'],['军械库','shop','Lv.2'],['载具工坊','truck','4 个改装槽'],['补给仓库','box','Lv.1'],['加油站','tower','指挥中心 Lv.3 解锁'],['雷达站','lab','指挥中心 Lv.3 解锁']];return `<section class="screen base-screen" aria-label="基地主页面"><div class="base-head"><h1>护送基地</h1><small>全队攻击 +10%　耐久 +5%</small></div><div class="base-map"><div class="map-roads"><svg viewBox="0 0 390 600" preserveAspectRatio="none" aria-hidden="true"><path d="M180-20 210 630M-20 99 400 170M-20 247 400 320M-20 392 400 470" stroke="#bcbcbc" stroke-width="40" fill="none"/><path d="M180-20 210 630M-20 99 400 170M-20 247 400 320M-20 392 400 470" stroke="#eee" stroke-width="2" stroke-dasharray="12 12" fill="none"/></svg></div><div class="base-buildings">${buildings.map((b,i)=>`<button class="building ${i>5?'locked':''}" data-preview="${b[0]}${i>5?'：指挥中心Lv.3解锁':''}">${art(b[1])}<strong>${i>5?'♙ ':''}${b[0]}${i===5?'<i class="dot"></i>':''}</strong><small>${b[2]}</small></button>`).join('')}</div></div><div class="base-bottom"><small>下一级营地：解锁加油站 / 雷达站</small><small>已开放 6 / 8 设施</small></div></section>`;}
function feedback(text){clearTimeout(feedbackTimer);$('#feedback').textContent=text;$('#feedback').classList.add('visible');feedbackTimer=setTimeout(()=>$('#feedback').classList.remove('visible'),1800);}
function updateSelection(){
  if(page!=='hero')return;
  const item=inventory.find(i=>i.id===selected);
  document.querySelectorAll('[data-item]').forEach(el=>el.classList.toggle('selected',el.dataset.item===selected));
  document.querySelectorAll('[data-slot]').forEach(el=>el.classList.toggle('compatible',!!item&&+el.dataset.slot===item.slot));
  if(!item){$('#clear-item')?.classList.add('hidden');$('#item-info').textContent=`${bagTab} · ${bagTab==='装备'?'未选择物品':'物品已按分类展示'}`;return;}
  const delta=item.power-equipped[hero][item.slot].power;
  $('#item-info').textContent=`${item.name} Lv.${item.level} · ${slots[item.slot]} · 战力 ${delta>=0?'+':''}${delta}`;
  $('#clear-item').classList.remove('hidden');
}
function equipItem(id,slot){
  const index=inventory.findIndex(i=>i.id===id),item=inventory[index];
  if(!item||item.slot!==slot){feedback('部位不匹配，未更换装备');return false;}
  const old=equipped[hero][slot];
  equipped[hero][slot]=item;inventory[index]=old;selected=null;
  rememberScroll();render();feedback(`${slots[slot]}已穿戴 · 旧装备已回背包`);
  $('#review-status').textContent=`${names[hero]}穿戴 ${item.name} Lv.${item.level}；${old.name} Lv.${old.level} 返回背包。物品总量保持不变。`;
  return true;
}
document.addEventListener('click',e=>{
  if(Date.now()<suppressClickUntil)return;
  const el=e.target.closest('button');if(!el)return;
  if(el.dataset.nav){rememberScroll();cancelDrag();page=el.dataset.nav;selected=null;render();return;}
  if(el.dataset.hero!==undefined){rememberScroll();hero=+el.dataset.hero;selected=null;render();return;}
  if(el.dataset.chapter){chapter=Math.min(5,Math.max(1,chapter+Number(el.dataset.chapter)));render();return;}
  if(el.dataset.difficulty){difficulty=el.dataset.difficulty;render();return;}
  if(el.dataset.bagTab){rememberScroll();bagTab=el.dataset.bagTab;selected=null;render();return;}
  if(el.dataset.shopTab){rememberScroll();shopTab=el.dataset.shopTab;render();return;}
  if(el.dataset.item){selected=el.dataset.item;updateSelection();return;}
  if(el.dataset.slot!==undefined){if(selected)equipItem(selected,+el.dataset.slot);else{el.classList.toggle('compatible');$('#review-status').textContent=`已选择 ${slots[+el.dataset.slot]} 槽。装备详情留给下一轮设计。`;}return;}
  if(el.hasAttribute('data-clear')){selected=null;render();return;}
  if(el.hasAttribute('data-free')){if(!freeClaimed){rememberScroll();freeClaimed=true;render();feedback('金币 +300');}return;}
  if(el.dataset.preview){document.querySelectorAll('[data-preview].selected').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');$('#review-status').textContent=`已选择「${el.dataset.preview}」入口。本轮仅评审一级入口，不展开二级流程。`;return;}
});
document.addEventListener('change',e=>{
  if(e.target.id==='bag-filter'){rememberScroll();filter=e.target.value;selected=null;render();}
});
function startDrag(id,x,y,touch=false){
  const item=inventory.find(e=>e.id===id);if(!item)return;
  selected=id;updateSelection();
  const ghost=document.createElement('div');ghost.className='drag-ghost';ghost.innerHTML=art(slotIcons[item.slot]);document.body.appendChild(ghost);
  drag={id,item,ghost,x,y,touch};
  document.querySelector(`[data-item="${id}"]`)?.classList.add('drag-source');
  document.querySelectorAll('[data-slot]').forEach(el=>el.classList.toggle('incompatible',+el.dataset.slot!==item.slot));
  moveDrag(x,y);
}
function moveDrag(x,y){if(!drag)return;drag.x=x;drag.y=y;drag.ghost.style.left=x-28+'px';drag.ghost.style.top=y-(drag.touch?64:28)+'px';const target=document.elementFromPoint(x,y)?.closest('[data-slot]');document.querySelectorAll('[data-slot]').forEach(el=>el.classList.toggle('drop-over',el===target&&+el.dataset.slot===drag.item.slot));}
function releasePointer(){
  const session=pointerSession;pointerSession=null;
  if(!session)return;
  clearTimeout(session.timer);
  if(session.source.hasPointerCapture?.(session.pointerId))session.source.releasePointerCapture(session.pointerId);
}
function cancelDrag(){
  if(drag){drag.ghost.remove();drag=null;}
  document.querySelectorAll('.drag-source,.incompatible,.drop-over').forEach(el=>el.classList.remove('drag-source','incompatible','drop-over'));
  releasePointer();
}
function finishDrag(x,y){
  if(!drag)return;
  const id=drag.id,target=document.elementFromPoint(x,y)?.closest('[data-slot]');
  cancelDrag();suppressClickUntil=Date.now()+350;
  if(target)equipItem(id,+target.dataset.slot);
  else{selected=null;updateSelection();feedback('已取消穿戴');}
}
// Equipment gestures own pointer capture so a long press cannot become native page scrolling.
document.addEventListener('pointerdown',e=>{
  if(!e.isPrimary||e.button!==0)return;
  const source=e.target.closest('[data-item]');if(!source)return;
  cancelDrag();
  const touch=e.pointerType!=='mouse',scroll=source.closest('.bag-scroll');
  const session={id:source.dataset.item,source,pointerId:e.pointerId,x:e.clientX,y:e.clientY,touch,scroll,scrollTop:scroll.scrollTop,mode:'pending',timer:null};
  pointerSession=session;source.setPointerCapture(e.pointerId);
  if(touch)session.timer=setTimeout(()=>{
    if(pointerSession!==session||session.mode!=='pending')return;
    session.mode='drag';startDrag(session.id,session.x,session.y,true);
  },220);
  e.preventDefault();
});
document.addEventListener('pointermove',e=>{
  const session=pointerSession;if(!session||e.pointerId!==session.pointerId)return;
  const distance=Math.hypot(e.clientX-session.x,e.clientY-session.y);
  if(session.mode==='pending'&&distance>(session.touch?8:5)){
    clearTimeout(session.timer);
    session.mode=session.touch?'scroll':'drag';
    if(session.mode==='drag')startDrag(session.id,e.clientX,e.clientY);
  }
  if(session.mode==='scroll')session.scroll.scrollTop=session.scrollTop+session.y-e.clientY;
  if(session.mode==='drag')moveDrag(e.clientX,e.clientY);
  e.preventDefault();
});
document.addEventListener('pointerup',e=>{
  const session=pointerSession;if(!session||e.pointerId!==session.pointerId)return;
  if(session.mode==='drag')finishDrag(e.clientX,e.clientY);
  else{
    if(session.mode==='pending'){selected=session.id;updateSelection();}
    releasePointer();suppressClickUntil=Date.now()+350;
  }
});
function abortPointer(e){
  if(!pointerSession||e.pointerId!==pointerSession.pointerId)return;
  cancelDrag();selected=null;updateSelection();
}
document.addEventListener('pointercancel',abortPointer);
document.addEventListener('lostpointercapture',abortPointer);
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-item]'))e.preventDefault();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){rememberScroll();cancelDrag();selected=null;render();}});
window.addEventListener('blur',()=>{cancelDrag();selected=null;updateSelection();});
$('#size').addEventListener('change',e=>{const [w,h]=e.target.value.split(',');$('.review').style.setProperty('--phone-w',w+'px');$('.phone').style.height=h+'px';});
$('#targets').addEventListener('change',e=>$('.phone').classList.toggle('show-targets',e.target.checked));
$('#reset').addEventListener('click',()=>{cancelDrag();resetGear();freeClaimed=false;render();$('#review-status').textContent='已重置穿戴演示。当前只有一级页面，没有二级页面或弹窗。';});
render();
</script>
</body>
</html>
